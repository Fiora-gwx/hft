# Registered exceptions checked by `cargo xtask hot-check` (tools/README.md "cargo xtask hot-check",
# docs/hot-path-rules.md "检查机制").
#
# [[allow]]: every `#[allow(...)]` / `#![allow(...)]` of a disallowed_* or C1 lint (unwrap_used, expect_used,
#   panic, unreachable, todo, unimplemented, indexing_slicing) in a hot/pure crate must match an entry:
#   `file` (glob: `*` = one path segment, `**` = any depth) and the lint in `lints`; `reason` is required.
# [[tsc]]: snapshot row fields holding a TSC value (D6); `class` = 1 (shifted by recovery_end),
#   2 (connection liveness, voided at cold start), 3 (calibration copy, not hashed); `reason` is required.

# ---------------------------------------------------------------- test, bench, example and build code
[[allow]]
file = "crates/*/tests/**"
lints = ["clippy::disallowed_types", "clippy::disallowed_macros", "clippy::disallowed_methods"]
reason = "integration tests are not on a hot path"

[[allow]]
file = "crates/*/benches/**"
lints = ["clippy::disallowed_types", "clippy::disallowed_macros", "clippy::disallowed_methods"]
reason = "benchmark drivers time with Instant and build fixtures; not on a hot path"

[[allow]]
file = "strategies/*/tests/**"
lints = ["clippy::disallowed_types", "clippy::disallowed_macros", "clippy::disallowed_methods"]
reason = "strategy integration tests are not on a hot path"

[[allow]]
file = "strategies/*/benches/**"
lints = ["clippy::disallowed_types", "clippy::disallowed_macros", "clippy::disallowed_methods"]
reason = "benchmark drivers time with Instant and build fixtures; not on a hot path"

[[allow]]
file = "crates/*/examples/**"
lints = ["clippy::disallowed_types", "clippy::disallowed_macros", "clippy::disallowed_methods"]
reason = "example/test-writer binaries (hft-journal testwriter); not part of a release artefact"

[[allow]]
file = "crates/*/build.rs"
lints = ["clippy::disallowed_types", "clippy::disallowed_macros", "clippy::disallowed_methods"]
reason = "build scripts print cargo directives"

# ---------------------------------------------------------------- cold replay
[[allow]]
file = "crates/*/src/planted.rs"
lints = ["clippy::disallowed_types"]
reason = "per-thread planted-defect switch table (static Mutex) behind the test-only `planted` feature; only hft-testkit's own tests enable it, never a production build (crates/hft-testkit TESTS.md TK-178)"

[[allow]]
file = "crates/hft-sequencer/src/driver/snapshot_diff.rs"
lints = ["clippy::disallowed_types", "clippy::disallowed_macros"]
reason = "bounded section index and field-name formatting for read-only offline snapshot diagnostics behind replay-io; absent from the default live build"

[[allow]]
file = "crates/hft-sequencer/src/driver/recompute_compare.rs"
lints = ["clippy::disallowed_types"]
reason = "bounded BTreeMap for deterministic offline Model comparison behind replay-io; not linked into the default live build"

