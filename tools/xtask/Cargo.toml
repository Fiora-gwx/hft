[package]
name = "xtask"
description = "Repository gates and generators (cargo xtask); spec: tools/README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Plain test files build as one binary (tests/main.rs); files with process-wide
# effects are separate [[test]] targets.
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
hft-event = { workspace = true }
hft-refdata = { workspace = true }
# journal-verify: the reading/verification implementation (no `writer` feature).
hft-journal = { workspace = true }
# dst: the shared suite selection and default step count (crates/hft-testkit README §6).
hft-testkit = { workspace = true }
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
serde_json = "1"
# Not `workspace = true`: the workspace entry enables `asm` (needs a C toolchain for the target).
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
toml = { workspace = true }
walkdir = "2"

[dev-dependencies]
criterion = { workspace = true }
crc32c = { workspace = true }
hft-event = { workspace = true }
hft-journal = { workspace = true, features = ["writer", "mem-backend"] }
hft-rt = { workspace = true }
hft-types = { workspace = true }
zerocopy = { workspace = true }

[[bench]]
name = "decoupling_gate"
harness = false

[lints]
workspace = true

[[test]]
name = "bench_gate"
path = "tests/bench_gate.rs"

[[test]]
name = "gen_schema"
path = "tests/gen_schema.rs"

[[test]]
name = "hot_check"
path = "tests/hot_check.rs"

[[test]]
name = "xtask_tests"
path = "tests/main.rs"
