[package]
name = "xtask"
description = "Repository gates and generators (cargo xtask); spec: tools/README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
hft-event = { workspace = true }
hft-refdata = { workspace = true }
regex = "1"
serde_json = "1"
toml = { workspace = true }
walkdir = "2"

[lints]
workspace = true
