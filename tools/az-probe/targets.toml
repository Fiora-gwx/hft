# az-probe target endpoints (tools/README.md "az-probe"; procedure: docs/runbooks/az-probe.md).
# Every A record of every host is probed (TCP handshake x9 per IP and cycle, TLS handshake).
# `core = true` endpoints enter the `compare` ranking sum (per exchange: the smallest minRTT).
# `ws` (optional): a public market-data stream for `--ws-first-frame`: `url`, `subscribe` (text frame
# sent after connecting, empty = none), `ts` (dotted path of the exchange event time in the JSON
# frame; numeric index for arrays) and `unit` (ms | us | ns). No key, no private stream.

# ---- Binance (core)
[[target]]
name = "binance-fstream"
host = "fstream.binance.com"
exchange = "binance"
core = true
ws = { url = "wss://fstream.binance.com/public/ws/btcusdt@bookTicker", subscribe = "", ts = "E", unit = "ms" }

