# ---- OKX (core)
[[target]]
name = "okx-ws"
host = "ws.okx.com"
port = 8443
exchange = "okx"
core = true
ws = { url = "wss://ws.okx.com:8443/ws/v5/public", subscribe = '{"op":"subscribe","args":[{"channel":"bbo-tbt","instId":"BTC-USDT-SWAP"}]}', ts = "data.0.ts", unit = "ms" }

[[target]]
name = "okx-rest"
host = "www.okx.com"
exchange = "okx"
core = true

# ---- Bitget (core)
[[target]]
name = "bitget-ws"
host = "ws.bitget.com"
exchange = "bitget"
core = true
ws = { url = "wss://ws.bitget.com/v2/ws/public", subscribe = '{"op":"subscribe","args":[{"instType":"USDT-FUTURES","channel":"books1","instId":"BTCUSDT"}]}', ts = "data.0.ts", unit = "ms" }

[[target]]
name = "bitget-rest"
host = "api.bitget.com"
exchange = "bitget"
core = true

