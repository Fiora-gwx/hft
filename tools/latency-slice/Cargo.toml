[package]
name = "latency-slice"
description = "M1.5 latency-probe vertical slice: mainnet BBO feed + simplified sequencer + testnet gw, seq/raw journals and the offline latency report; hft-net host probes and a network-free dry run (probe only, never in a production archive); spec: tools/latency-slice/README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "latency-slice"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hft-types.workspace = true
hft-refdata.workspace = true
hft-event.workspace = true
hft-rt.workspace = true
hft-journal = { workspace = true, features = ["writer"] }
hft-net.workspace = true
hft-venue-proto.workspace = true
hft-venue.workspace = true
venue-binance.workspace = true
hft-telemetry.workspace = true
# --dry-run market generator (README "依赖": the slice ships only in development build artefacts).
hft-testkit.workspace = true
zerocopy.workspace = true
toml.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc.workspace = true
# HostProfile.profile_sha256 of /run/hft/hostprofile.json. Not `workspace = true`: the workspace entry
# enables `asm` (needs a C toolchain for the target).
sha2 = "0.10"

[dev-dependencies]
hft-journal = { workspace = true, features = ["writer", "mem-backend"] }
ed25519-dalek = "2"
