# DEMO ONLY: intentional negative after-fee edges for TD chain measurement.
# Account must have is_prod = false; use testnet order endpoints.
[strategy]
instance = "demo-spread"
account = "demo"
schema = { id = 3, version = 3 }
version = 1
source = "manual"

[defaults]
enabled = true
min_edge = "-0.0030"
close_edge = "-0.0030"
slip = "0"
depth_frac = "0.1"
max_chunk_notional = "25"
max_position_notional = "50"
max_quote_age_ms = "100ms"
cooldown_ms = "7s"
max_hedge_failures = "3"

[[groups]]
n = 1
asset = "ETH"
open_allowed = true
legs = [{ inst = "binance-usdm:ETHUSDT" }, { inst = "bitget-uta-spot:ETHUSDT" }]
