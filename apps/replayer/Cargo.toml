[package]
name = "replayer"
description = "Offline journal verification using the production sequencer and strategy registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
hft-refdata.workspace = true
hft-telemetry.workspace = true
zerocopy.workspace = true
hdrhistogram = { version = "7.5", default-features = false, features = ["serialization"] }
hft-event.workspace = true
hft-journal.workspace = true
hft-sequencer = { workspace = true, features = ["replay-io"] }
hft-strategy-sdk.workspace = true
hft-strategy-registry = { path = "../../strategies/registry" }
hft-rt.workspace = true
hft-replay.workspace = true
hft-sim.workspace = true
hft-types.workspace = true
serde_json = "1"

[features]
# Tests over the generated 1 h / 3 h path-model fixtures (tests/long_model.rs `heavy`, RPL-270,
# RPL-271, RPL-279–281): not in the default local test binary; CI runs them in the `heavy-tests`
# job (docs/development.md).
long-fixtures = []

[dev-dependencies]
hft-refdata.workspace = true
hft-journal = { workspace = true, features = ["mem-backend"] }
hft-sequencer = { workspace = true, features = ["live"] }
hft-testkit = { workspace = true, features = ["seq"] }
hft-types.workspace = true
zerocopy.workspace = true
crc32c.workspace = true
# Not `workspace = true`: the workspace entry enables `asm`, whose sha2-asm build needs a C
# toolchain for the target (same as hft-refdata, hft-strategy-sdk).
sha2 = "0.10"
xtask = { path = "../../tools/xtask" }

[[test]]
name = "cli"
path = "tests/cli.rs"
