[workspace]
resolver = "2"
# M1 members; later milestones add theirs (docs/development.md, architecture-v2/11 §3).
members = [
    "crates/hft-types",
    "crates/hft-refdata",
    "crates/hft-event",
    "crates/hft-rt",
    "crates/hft-journal",
    "crates/hft-strategy-sdk",
    "crates/hft-book",
    "crates/hft-sim",
    "crates/hft-ledger",
    "crates/hft-testkit",
    "crates/hft-venue-proto",
    "crates/hft-telemetry",
    "crates/hft-net",
    "crates/hft-venue",
    "crates/venue-binance",
    "crates/hft-risk",
    "tools/xtask",
    "tools/hft-cfg",
    "tools/hostprobe",
    "tools/latency-slice",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
hft-types = { path = "crates/hft-types" }
hft-refdata = { path = "crates/hft-refdata" }
zerocopy = { version = "0.8", features = ["derive"] }
crc32c = "0.6"
sha2 = { version = "0.10", features = ["asm"] }
rustc-hash = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
libc = "0.2"
toml = "0.8"
proptest = "1"
criterion = { version = "0.5", default-features = false }
rstest = "0.23"
loom = "0.7"
trybuild = "1"
hft-rt = { path = "crates/hft-rt" }
rtrb = "0.3"
static_assertions = "1"
hft-event = { path = "crates/hft-event" }
hft-journal = { path = "crates/hft-journal" }
hft-strategy-sdk = { path = "crates/hft-strategy-sdk" }
hft-book = { path = "crates/hft-book" }
hft-sim = { path = "crates/hft-sim" }
hft-ledger = { path = "crates/hft-ledger" }
hft-testkit = { path = "crates/hft-testkit" }
hft-venue-proto = { path = "crates/hft-venue-proto" }
hft-telemetry = { path = "crates/hft-telemetry" }
hft-net = { path = "crates/hft-net" }
hft-venue = { path = "crates/hft-venue" }
venue-binance = { path = "crates/venue-binance" }
hft-risk = { path = "crates/hft-risk" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Build profiles: the single home is docs/development.md#构建剖面.
[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
overflow-checks = false
debug = "line-tables-only"

[profile.release-hot]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = false
debug-assertions = true
overflow-checks = true
panic = "unwind"

[profile.bench]
lto = "fat"
codegen-units = 1
