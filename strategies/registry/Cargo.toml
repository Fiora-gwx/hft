[package]
name = "hft-strategy-registry"
description = "The only list of real strategies: one strategy_set! invocation (Strategies) and export_schemas()"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Optional strategies are gated by features named after their crates (README "kind_id 登记"); none of
# them is included unless its feature is enabled.
[features]
cross-taker = ["dep:cross-taker"]

[dependencies]
hft-strategy-sdk = { workspace = true, features = ["schema-json"] }
latency-probe.workspace = true
cross-taker = { workspace = true, optional = true }

[dev-dependencies]
hft-strategy-sdk = { workspace = true, features = ["testing"] }
serde_json = "1"
hft-testkit = { workspace = true, features = ["seq"] }
hft-event.workspace = true
hft-types.workspace = true
zerocopy.workspace = true
