# cargo-deny configuration (docs/hot-path-rules.md "检查机制"; docs/development.md 质量门).
# `cargo xtask ci` runs `cargo deny check licenses bans` (blocking); `advisories` runs separately and never
# blocks (Cargo.lock-changing PRs and the nightly batch).

[graph]
all-features = true

[licenses]
# Our own crates are `publish = false` with a proprietary licence.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    # hft-net TLS stack: subtle (rustls).
    "BSD-3-Clause",
    "BSL-1.0",
    # hft-net TLS stack: webpki-roots (Mozilla root store data licence).
    "CDLA-Permissive-2.0",
    # hft-net TLS stack: aws-lc-rs/aws-lc-sys, rustls-webpki, untrusted.
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # N4: no arbitrary-precision decimals or big integers (fixed-point i64/i128 only).
    { crate = "rust_decimal", reason = "N4" },
    { crate = "bigdecimal", reason = "N4" },
    { crate = "num-bigint", reason = "N4" },
]

[advisories]
# Advisories never block CI (docs/development.md); ignores carry an expiry date and a reason.
ignore = []
