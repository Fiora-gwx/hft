# Quality gates (docs/development.md#ci-概要). Only calls quality-gates.yml:
# pull requests -> fast lane; pushes to codex/m2-integration and main, and manual dispatch on any
# branch -> full lane.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, codex/m2-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel only superseded runs of the same PR; every integration/main push keeps its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gates:
    uses: ./.github/workflows/quality-gates.yml
    with:
      lane: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
    # Union of what the called jobs request (docs/development.md#凭证与权限):
    # decoupling-gate: pull-requests read; rust: id-token for the S3 fixtures (OIDC).
    permissions:
      contents: read
      pull-requests: read
      id-token: write
