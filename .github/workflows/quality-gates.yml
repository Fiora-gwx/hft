# Quality gates, called by ci.yml and nightly.yml (docs/development.md#质量门quality-gatesyml).
# Two lanes (input `lane`):
# - fast (pull requests, target < 10 min wall): paths, docs, decoupling-gate, ops-py, and for the
#   affected packages (changed + reverse dependencies, .github/scripts/related-tests.py) clippy,
#   cargo-nextest and a 20-seed DST smoke;
# - full (pushes to codex/m2-integration and main, nightly): the whole workspace (`cargo xtask ci`:
#   clippy, all tests incl. proc and doctests, golden, 200-seed DST smoke), heavy tests, replay-dst,
#   benchmarks, aarch64 check, path-triggered gates.
# `acceptance` (.github/scripts/ci-summary.py) requires every job of the lane.
#
# Steps for components of later milestones are guarded by `steps.xtask.outputs.<subcommand>`
# (.github/scripts/xtask-inventory.sh: a subcommand that is due but missing fails the job) or by
# the existence of the path they need; each guard names the milestone in which it starts to run.
name: Quality gates

on:
  workflow_call:
    inputs:
      lane:
        description: fast (PR) or full (integration pushes, nightly)
        type: string
        default: full
      sha:
        description: Commit to test (default the PR head or the pushed commit)
        type: string
        default: ""
      replay_seed_mode:
        description: replay-dst seed source (commit or date)
        type: string
        default: commit

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Test the exact commit that preflight later looks up (the PR head, not the merge ref).
  HEAD_SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  LANE: ${{ inputs.lane }}

jobs:
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
      scaffold: ${{ steps.paths.outputs.scaffold }}
      replay: ${{ steps.paths.outputs.replay }}
      fuzz_targets: ${{ steps.paths.outputs.fuzz_targets }}
      bench_crates: ${{ steps.paths.outputs.bench_crates }}
      benchmarks: ${{ steps.paths.outputs.benchmarks }}
      toolchain: ${{ steps.paths.outputs.toolchain }}
      cargo_lock: ${{ steps.paths.outputs.cargo_lock }}
      gen_host: ${{ steps.paths.outputs.gen_host }}
      python: ${{ steps.paths.outputs.python }}
      ops: ${{ steps.paths.outputs.ops }}
      has_tests: ${{ steps.related.outputs.has_tests }}
      packages: ${{ steps.related.outputs.packages }}
      dst: ${{ steps.related.outputs.dst }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Classify changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ env.BASE_SHA }}
          HEAD: ${{ env.HEAD_SHA }}
        run: python3 .github/scripts/changed-paths.py
      # Fast lane package selection: changed members plus their reverse dependencies.
      - name: Select affected packages (fast lane)
        id: related
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ env.BASE_SHA }}
          HEAD: ${{ env.HEAD_SHA }}
        run: python3 .github/scripts/related-tests.py plan

  replay-dst:
    needs: paths
    if: ${{ !cancelled() && inputs.lane == 'full' }}
    uses: ./.github/workflows/replay-dst.yml
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      seed_mode: ${{ inputs.replay_seed_mode }}

  decoupling-gate:
    # Judges a diff: PRs and pushes only (nightly has none).
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: bash .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86-xtask
      - name: xtask subcommands
        id: xtask
        run: bash .github/scripts/xtask-inventory.sh

      # M1 (tools/TESTS.md TOOL-012..019). On main pushes: the merge commit against its first
      # parent, with the labels and reviews of the PR it came from.
      - name: cargo xtask decoupling-gate
        if: steps.xtask.outputs.decoupling-gate == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            base=$BASE_SHA
            pr=$PR
          else
            base=$(git rev-parse "$HEAD_SHA^1")
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')
          fi
          args=(--base "$base" --head "$HEAD_SHA")
          if [[ -n $pr ]]; then args+=(--pr "$pr"); fi
          cargo xtask decoupling-gate "${args[@]}"
      - name: Report a decoupling exemption
        if: ${{ !cancelled() && steps.xtask.outputs.decoupling-gate == 'true' }}
        run: python3 .github/scripts/report-exemption.py

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0 # gen-schema --check compares against the merge base
      - name: CI policy regression tests
        run: python3 -m unittest discover -s tools/xtask/tests -p 'test_ci_*.py' -v
      # Pinned release binary, checked against its SHA-256 (the docker://rhysd/actionlint image hit
      # Docker Hub's anonymous pull rate limit). shellcheck from the runner image checks run: blocks.
      - name: actionlint
        env:
          AL_VER: 1.7.12
          AL_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          f=actionlint_${AL_VER}_linux_amd64.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v${AL_VER}/$f"
          echo "$AL_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Install pinned Rust toolchain
        run: bash .github/scripts/install-rust.sh
      - name: Formatting (before any Rust build)
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86-xtask
      - name: xtask subcommands
        id: xtask
        run: bash .github/scripts/xtask-inventory.sh
      - name: Dependency direction
        if: ${{ !cancelled() }}
        run: cargo xtask deps
      - name: Hot-path static rules
        if: ${{ !cancelled() }}
        run: cargo xtask hot-check
      - name: cargo xtask doc-check
        if: ${{ !cancelled() }}
        run: cargo xtask doc-check
      - name: Fixture index and generated schemas
        if: ${{ !cancelled() }}
        run: |
          cargo xtask fixtures check
          cargo xtask gen-schema --check
      - name: cargo xtask test-trace (report-only)
        # docs/tests/README.md §6: unimplemented/extra/inconsistent are reported, never fail; only
        # hard spec errors (duplicate ids, malformed 里程碑/实现) do. Per-milestone counts go to the
        # step summary.
        if: ${{ !cancelled() }}
        run: |
          rc=0
          cargo xtask test-trace || rc=$?
          python3 - <<'PY' >>"$GITHUB_STEP_SUMMARY" || true
          import json
          j = json.load(open("target/xtask/test-trace.json", encoding="utf-8"))
          print("### test-trace (report-only)\n")
          print("| Milestone | Cases | Implemented | Unimplemented |\n|---|---|---|---|")
          for m, c in j["by_milestone"].items():
              print(f"| {m} | {c['cases']} | {c['implemented']} | {c['unimplemented']} |")
          print(f"\nunimplemented (<= current milestone) {len(j['unimplemented'])}, extra {len(j['extra'])}, "
                f"inconsistent {len(j['inconsistent'])}, errors {len(j['errors'])}")
          PY
          exit $rc

  # ---- fast lane (pull requests) ------------------------------------------------------------
  # Tests of the affected packages with cargo-nextest, two partitions in parallel (no proc or
  # compile-fail binaries, heavy::, RPL-012 batch or doctests: those run in the full lane).
  # Read-only cache of the full `rust` job.
  fast-test:
    needs: paths
    if: >-
      ${{ !cancelled() && inputs.lane == 'fast' && needs.paths.outputs.docs_only != 'true' &&
          needs.paths.outputs.has_tests != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    env:
      # Same CARGO*/CC* variables as `rust`: rust-cache hashes them into the cache key.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Plan the affected package tests
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ env.BASE_SHA }}
          HEAD: ${{ env.HEAD_SHA }}
        run: python3 .github/scripts/related-tests.py plan
      - name: Free runner disk
        run: bash .github/scripts/free-disk.sh
      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends strace python3-numpy
      - name: Install pinned Rust toolchain
        run: bash .github/scripts/install-rust.sh
      - name: Install pinned cargo-nextest (SHA-256 checked)
        run: bash .github/scripts/install-nextest.sh
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache's default suffix is <key>-<job>; shared-key replaces both. A PR finds the
          # full `rust` job's cache of its base branch (integration pushes run the full lane); on
          # a miss the first shard saves this PR's own entry (scoped to the PR ref) so later pushes
          # of the same PR start warm.
          shared-key: x86-ci-v2-rust
          save-if: ${{ matrix.shard == '1/2' }}
      - name: Restore nested test builds
        uses: actions/cache/restore@v4
        with:
          path: |
            target/tests/trybuild
            target/jnl-feature
          key: x86-nested-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: x86-nested-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Test the affected packages (cargo nextest)
        env:
          HEAD: ${{ env.HEAD_SHA }}
        run: |
          # tmpfs journal segments are mlocked (crates/hft-journal JNL-040/044/045).
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          python3 .github/scripts/related-tests.py run
      - name: Shard name
        id: shard
        if: always()
        run: echo "name=${SHARD/\//-of-}" >>"$GITHUB_OUTPUT"
      - name: Upload fast-lane plan and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: related-tests-${{ steps.shard.outputs.name }}
          path: target/xtask/related-tests.json
          if-no-files-found: ignore
          retention-days: 7

  fast-clippy:
    needs: paths
    if: >-
      ${{ !cancelled() && inputs.lane == 'fast' && needs.paths.outputs.docs_only != 'true' &&
          needs.paths.outputs.has_tests != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Install pinned Rust toolchain
        run: bash .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86-ci-v2-rust
          save-if: false
      - name: clippy on the affected packages
        env:
          PACKAGES: ${{ needs.paths.outputs.packages }}
        run: |
          args=()
          for p in $PACKAGES; do args+=(-p "$p"); done
          cargo clippy --locked --profile ci "${args[@]}" --all-targets --all-features -- -D warnings
      - name: xtask subcommands
        if: needs.paths.outputs.cargo_lock == 'true'
        id: xtask
        run: bash .github/scripts/xtask-inventory.sh
      - name: cargo deny check licenses bans (Cargo.lock changed)
        if: needs.paths.outputs.cargo_lock == 'true' && steps.xtask.outputs.setup == 'true'
        run: |
          cargo xtask setup
          cargo deny check licenses bans

  # DST smoke when hft-testkit (the engine adapter) is affected: 20 commit-derived seeds plus the
  # regression set, baseline and the LED-080/LED-081 cases (the full lane runs 200 seeds).
  fast-dst:
    needs: paths
    if: >-
      ${{ !cancelled() && inputs.lane == 'fast' && needs.paths.outputs.docs_only != 'true' &&
          needs.paths.outputs.dst == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Install pinned Rust toolchain
        run: bash .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86-ci-v2-rust
          save-if: false
      - name: xtask subcommands
        id: xtask
        run: bash .github/scripts/xtask-inventory.sh
      - name: DST smoke (20 seeds + regressions)
        if: steps.xtask.outputs.dst == 'true'
        run: |
          cargo xtask dst --seeds 20 --regressions
          for c in LED-080 LED-081; do
            cargo xtask dst --seeds 20 --regressions --case "$c"
          done
      - name: Upload DST failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dst-failures
          path: |
            target/dst/*/repro.txt
            target/dst/*/faults.txt
            target/dst/*/journal.bin
            target/dst/*.json
            target/xtask/dst*.json
          if-no-files-found: ignore
          retention-days: 7

  # ---- full lane (integration-branch and main pushes, nightly) --------------------------------
  arch-check:
    needs: paths
    if: ${{ !cancelled() && inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Install cross compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Free runner disk
        run: bash .github/scripts/free-disk.sh
      - name: Install pinned Rust toolchain
        run: bash .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86-ci-v2-rust
          save-if: false
      - name: aarch64 cross check (ISA-specific code stays compilable)
        # Also after a failed gate: its verdict is independent, and its dependencies get cached.
        if: ${{ !cancelled() }}
        run: cargo check --locked --target aarch64-unknown-linux-gnu --workspace


  benchmarks:
    needs: paths
    if: >-
      ${{ !cancelled() && inputs.lane == 'full' &&
          (needs.paths.result != 'success' || needs.paths.outputs.bench_crates != '' ||
           needs.paths.outputs.benchmarks == 'true' || needs.paths.outputs.toolchain == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Free runner disk
        run: bash .github/scripts/free-disk.sh
      - name: Install pinned Rust toolchain
        run: bash .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86-ci-v2-rust
          save-if: false
      - name: xtask subcommands
        id: xtask
        run: bash .github/scripts/xtask-inventory.sh
      # M1.5 (bench-gate): hot crates or benchmarks/ changed; ci profile, numbers are reported only.
      - name: Benchmark smoke (report only)
        if: >-
          (needs.paths.result != 'success' || needs.paths.outputs.bench_crates != '' || needs.paths.outputs.benchmarks == 'true') &&
          steps.xtask.outputs.bench-gate == 'true'
        env:
          CRATES: ${{ needs.paths.outputs.bench_crates }}
          ALL: ${{ needs.paths.result != 'success' || needs.paths.outputs.benchmarks == 'true' }}
        run: |
          df -h /
          du -sh "$CARGO_TARGET_DIR"
          if [[ $ALL == true ]]; then
            cargo xtask bench-gate --smoke
          else
            for c in $CRATES; do cargo xtask bench-gate --smoke --crate "$c"; done
          fi

      # M1.5: rust-toolchain.toml changed -> base and head benchmark smoke in this job (report
      # only, hot-path-rules B4).
      - name: Toolchain change, base vs head benchmark (report only)
        if: needs.paths.outputs.toolchain == 'true' && steps.xtask.outputs.bench-gate == 'true'
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
        run: |
          base=$BASE_SHA
          if [[ $EVENT != pull_request ]]; then base=$(git rev-parse "$HEAD_SHA^1"); fi
          wt=$RUNNER_TEMP/base
          git worktree add --detach "$wt" "$base"
          (cd "$wt" && bash "$GITHUB_WORKSPACE/.github/scripts/install-rust.sh" &&
            CARGO_TARGET_DIR="$wt/target" cargo xtask bench-gate --smoke)
          cargo xtask bench-gate --smoke
          {
            echo "### Toolchain change: benchmark smoke, base \`$base\` vs head"
            echo
            echo "<details><summary>base</summary>"
            echo
            echo '```json'
            cat "$wt/target/xtask/bench-gate.json"
            echo '```'
            echo "</details><details><summary>head</summary>"
            echo
            echo '```json'
            cat target/xtask/bench-gate.json
            echo '```'
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark smoke data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: |
            target/bench/
            target/xtask/bench-gate.json
          if-no-files-found: ignore
          retention-days: 7

  rust:
    needs: paths
    # Full lane only; a coupling violation still gets build/test feedback.
    if: ${{ !cancelled() && inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    # Safety cap: a cold cache (first full-lane run of a branch) needs ~30 min incl. the cache save.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # S3 fixtures through GitHub OIDC (replay-verify samples)
    env:
      # scaffold-gate reuses this job's target directory (no second full build).
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0 # path rules, gen-schema's merge-base baseline, toolchain base worktree
      # The build, the aarch64 check and the benchmark links need more than the stock image's
      # free space on / (a full disk killed rust-lld with SIGBUS); removal runs in the background.
      - name: Free runner disk
        run: bash .github/scripts/free-disk.sh
      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross strace python3-numpy zstd
      - name: Install pinned Rust toolchain
        run: bash .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-ci-v2
          # A cold run (new Cargo.lock, eviction) builds the cargo plugins and the whole test tree
          # from scratch and can reach the time limit; keep what it built even if it fails.
          # The first save of a key is final (later runs hit it fully and do not save), so the
          # dependency builds run before any gate can stop the job (next two steps).
          cache-on-failure: true
      # Nested cargo builds that tests run themselves (trybuild compile-fail/UI tests under
      # target/tests/trybuild, hft-journal's feature-gate fixture under target/jnl-feature) build
      # their dependencies in the dev profile. rust-cache would keep them, but its key is saved
      # once, often by a run that stopped before the tests; this cache is saved after a run whose
      # tests all ran, once per Cargo.lock (docs/development.md, `rust` job).
      - name: Restore nested test builds
        id: nested
        uses: actions/cache/restore@v4
        with:
          path: |
            target/tests/trybuild
            target/jnl-feature
          key: x86-nested-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: x86-nested-${{ hashFiles('rust-toolchain.toml') }}-
      - name: xtask subcommands
        id: xtask
        run: bash .github/scripts/xtask-inventory.sh
      - name: Install pinned cargo plugins and nightly (cargo xtask setup)
        if: steps.xtask.outputs.setup == 'true'
        run: cargo xtask setup
      - name: Prepare proc test prerequisites
        run: bash .github/scripts/test-prereqs.sh

      # The units of the unit/property step of `cargo xtask ci` (`cargo test --profile ci
      # --workspace --all-features`), which then finds everything built; `cargo build` because
      # `--keep-going` (every dependency is built even past a broken crate, so a failing run
      # still caches a complete dependency tree) is unstable on `cargo test`.
      # Then the DST runner exactly as `cargo xtask dst` builds it (its own feature set): its
      # dependency builds land in rust-cache like the others.
      - name: Build the ci-profile test tree
        run: |
          rc=0
          cargo build --locked --profile ci --workspace --all-features --tests --examples --keep-going || rc=$?
          if [[ -f crates/hft-testkit/src/bin/hft-dst.rs ]]; then
            cargo build --locked --profile ci -p hft-testkit --features dst-bin --bin hft-dst || rc=$?
          fi
          exit $rc

      # fmt, clippy, deny licenses/bans, deps, hot-check, fixtures check, unit/property (ci profile),
      # golden, DST smoke (200 seeds + regressions, from M2), gen-schema --check
      # (tools/README.md "cargo xtask ci"); doc-check is the docs job's.
      - name: cargo xtask ci
        id: ci
        env:
          HFT_REPLAY_EVIDENCE_DIR: ${{ github.workspace }}/target/replay-model
        # Also after a failed build: fmt and clippy still report.
        if: ${{ !cancelled() }}
        run: |
          # tmpfs journal segments are mlocked (crates/hft-journal JNL-040/044/045); the hosted
          # runner's RLIMIT_MEMLOCK (8 MiB) is below one 16 MiB test segment.
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          # doc-check runs in the docs job on the same commit (every PR and main push).
          cargo xtask ci --no-doc-check
      - name: Upload generated Model replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-model-evidence
          path: target/replay-model/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload DST failure evidence
        if: failure() && steps.ci.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dst-failures
          path: |
            target/dst/*/repro.txt
            target/dst/*/faults.txt
            target/dst/*/journal.bin
            target/dst/*/rpl-283-*/
            target/dst/*/rpl-284-*/
            target/dst/*.json
            target/xtask/dst.json
          if-no-files-found: ignore
          retention-days: 7
      # The replayer's DST file cases keep their directories only when they fail (TmpDir evidence,
      # crates/hft-testkit README "11. 临时目录").
      - name: Upload failed replayer DST file evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replayer-dst-file-evidence
          path: |
            target/dst/*/rpl-28[3-8]-*/
          if-no-files-found: ignore
          retention-days: 7
      # Directed infrastructure evidence, not LED-081 seed acceptance.
      - name: Upload settlement boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-settlement
          path: target/dst/reconcile-settlement-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Save nested test builds
        if: steps.ci.outcome == 'success' && steps.nested.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            target/tests/trybuild
            target/jnl-feature
          key: ${{ steps.nested.outputs.cache-primary-key }}
      - name: Upload ledger case seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-case-seeds
          path: |
            target/dst/LED-080/
            target/xtask/dst-LED-080.json
            target/dst/LED-081/
            target/xtask/dst-LED-081.json
          if-no-files-found: ignore
          retention-days: 7

      # M3 (gen-host lands with deploy/gen): non-Markdown deploy/ or apps/hft-core changes.
      - name: cargo xtask gen-host --check
        id: genhost
        if: needs.paths.outputs.gen_host == 'true' && steps.xtask.outputs.gen-host == 'true'
        run: cargo xtask gen-host --check

      # M2: crates/ apps/ strategies/ tools/ changed.
      - name: cargo xtask scaffold-gate
        if: needs.paths.outputs.scaffold == 'true' && steps.xtask.outputs.scaffold-gate == 'true'
        run: cargo xtask scaffold-gate

      # M3 (cargo xtask fuzz and tools/xtask/fuzz-targets.toml): 60 s per changed target.
      - name: Fuzz smoke of changed targets
        if: needs.paths.outputs.fuzz_targets != '' && steps.xtask.outputs.fuzz == 'true'
        env:
          TARGETS: ${{ needs.paths.outputs.fuzz_targets }}
        run: |
          for t in $TARGETS; do
            cargo xtask fuzz "$t" --time 60
          done

      # M2 (replay-verify) + M3 (fixtures fetch): strategy/exec/risk/OMS/sequencer changed.
      - name: Configure AWS credentials for S3 fixtures (OIDC)
        id: aws
        if: >-
          needs.paths.outputs.replay == 'true' && steps.xtask.outputs.replay-verify == 'true' &&
          steps.xtask.outputs.fixtures == 'true' && hashFiles('fixtures/replay/*.pointer.toml') != '' &&
          vars.HFT_FIXTURES_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.HFT_FIXTURES_ROLE_ARN }}
          aws-region: ${{ vars.HFT_FIXTURES_AWS_REGION }}
      - name: replay-verify fixtures/replay samples
        if: >-
          needs.paths.outputs.replay == 'true' && steps.xtask.outputs.replay-verify == 'true' &&
          steps.xtask.outputs.fixtures == 'true' && hashFiles('fixtures/replay/*.pointer.toml') != ''
        env:
          AWS_OK: ${{ steps.aws.outcome }}
        run: |
          if [[ $AWS_OK != success ]]; then
            echo "::error::replay samples need the fixture role: set repository variables HFT_FIXTURES_ROLE_ARN and HFT_FIXTURES_AWS_REGION"
            exit 1
          fi
          cargo xtask fixtures fetch
          for p in fixtures/replay/*.pointer.toml; do
            cargo xtask replay-verify "$p"
          done

      - name: cargo deny check advisories (Cargo.lock changed; non-blocking)
        if: needs.paths.outputs.cargo_lock == 'true'
        continue-on-error: true
        run: |
          if ! command -v cargo-deny >/dev/null; then
            echo "::warning::cargo-deny is not installed (cargo xtask setup)"
            exit 1
          fi
          cargo deny check advisories

      # Generated files out of date -> upload the regenerated diff; a human applies it with
      # `git apply` and commits it (no local build needed).
      - name: Regenerate generated files into regen.patch
        id: regen
        if: failure() && (steps.ci.outcome == 'failure' || steps.genhost.outcome == 'failure')
        env:
          HAS_GEN_SCHEMA: ${{ steps.xtask.outputs.gen-schema }}
          HAS_GEN_HOST: ${{ steps.xtask.outputs.gen-host }}
        run: |
          set +e
          if [[ $HAS_GEN_SCHEMA == true ]]; then
            cargo xtask gen-schema
            HFT_REGEN_GOLDEN=1 cargo test --locked --profile ci -p hft-event --test golden
            HFT_REGEN_GOLDEN=1 cargo test --locked --profile ci -p hft-event --test event version::evt_071_old_versions_zero_fill
            SIM_GOLDEN_BLESS=1 cargo test --locked --profile ci -p hft-sim --test golden sim_123_cross_arch_golden
          fi
          if [[ $HAS_GEN_HOST == true ]]; then cargo xtask gen-host; fi
          core=""
          for p in target/ci/hft-core target/release/hft-core target/debug/hft-core; do
            if [[ -x $p ]]; then core=$p; break; fi
          done
          if [[ -n $core && -d fixtures/strategy-schemas ]]; then
            "$core" schemas --out fixtures/strategy-schemas
          fi
          git add -N .
          git diff --binary >"$RUNNER_TEMP/regen.patch"
          if [[ -s $RUNNER_TEMP/regen.patch ]]; then echo "has=true" >>"$GITHUB_OUTPUT"; fi
          exit 0
      - name: Upload regen.patch
        if: failure() && steps.regen.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regen-patch
          path: ${{ runner.temp }}/regen.patch
          retention-days: 7

      - name: Job wall time
        if: always()
        run: |
          mins=$(( ($(date +%s) - JOB_START + 59) / 60 ))
          echo "rust job (full lane): about $mins min" >>"$GITHUB_STEP_SUMMARY"

  # Heavy tests (docs/development.md "质量门"): the 1 h / 3 h replayer fixtures (RPL-270/271/279–281,
  # feature replayer/long-fixtures); every test under a `heavy::` module, which `cargo xtask ci`
  # skips. Own cache: the feature set resolves differently from the workspace build.
  heavy-tests:
    needs: paths
    if: ${{ !cancelled() && inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      HEAVY_FEATURES: replayer/long-fixtures
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Free runner disk
        run: bash .github/scripts/free-disk.sh
      - name: Install pinned Rust toolchain
        run: bash .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-heavy-v1
          cache-on-failure: true
      - name: Build the heavy test assemblies
        run: cargo build --locked --profile ci -p replayer --features "$HEAVY_FEATURES" --tests --examples
      - name: "Run the heavy:: tests"
        env:
          HFT_REPLAY_EVIDENCE_DIR: ${{ github.workspace }}/target/replay-model
        run: |
          cargo test --locked --profile ci -p replayer --features "$HEAVY_FEATURES" --tests --no-fail-fast -- heavy::
      - name: Upload generated long-fixture Model replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-model-evidence-long
          path: target/replay-model/
          if-no-files-found: ignore
          retention-days: 7

  ops-py:
    needs: paths
    # Both lanes; skipped only for a docs-only PR.
    if: >-
      ${{ !cancelled() && needs.paths.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: No relevant changes
        if: >-
          needs.paths.outputs.python != 'true' && needs.paths.outputs.ops != 'true' &&
          needs.paths.outputs.gen_host != 'true'
        run: echo "无相关改动 (no python/, strategies/*/pipeline/, crates/hft-py/, tools/az-probe/, deploy/, apps/hft-core/ or .github/ changes)"

      # Python packages land with their milestones (hft-py M2, pipeline/ops_bot M4-M5).
      - uses: actions/setup-python@v5
        if: >-
          needs.paths.outputs.python == 'true' || needs.paths.outputs.ops == 'true' ||
          needs.paths.outputs.gen_host == 'true'
        with:
          python-version: "3.12"
      - name: CI script policy regression tests
        if: needs.paths.outputs.ops == 'true'
        run: python -m unittest discover -s tools/xtask/tests -p 'test_ci_*.py' -v
      - name: Install pinned Rust toolchain (hft_py)
        if: needs.paths.outputs.python == 'true' && hashFiles('crates/hft-py/Cargo.toml') != ''
        run: bash .github/scripts/install-rust.sh
      - name: Python packages (maturin develop, ruff, mypy --strict, pytest)
        if: needs.paths.outputs.python == 'true'
        run: |
          mapfile -t pkgs < <(git ls-files 'python/*pyproject.toml' 'strategies/*/pipeline/pyproject.toml' 'tools/az-probe/pyproject.toml' | xargs -r -n1 dirname | sort -u)
          if ((${#pkgs[@]} == 0)) && [[ ! -f crates/hft-py/Cargo.toml ]]; then
            echo "no Python packages yet"
            exit 0
          fi
          python -m venv "$RUNNER_TEMP/venv"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/venv/bin/activate"
          if [[ -f python/requirements-dev.lock ]]; then
            python -m pip install -r python/requirements-dev.lock
          else
            echo "::warning::python/requirements-dev.lock is missing; installing unpinned dev tools"
            python -m pip install maturin ruff mypy pytest numpy polars pyarrow duckdb
          fi
          if [[ -f crates/hft-py/Cargo.toml ]]; then
            # crates/hft-py/TESTS.md: the `testing` build here; the release build (no `testing`) in a
            # second venv for the public-surface and stub rows (HFT_PY_RELEASE_PYTHON); TW and the
            # fixture generator for the journal fixtures; hot segments are mlocked (> 8 MiB).
            maturin build --profile ci --features testing --manifest-path crates/hft-py/Cargo.toml -o "$RUNNER_TEMP/wheels"
            maturin build --profile ci --manifest-path crates/hft-py/Cargo.toml -o "$RUNNER_TEMP/wheels-rel"
            python -m pip install --no-deps "$RUNNER_TEMP"/wheels/*.whl
            python -m venv "$RUNNER_TEMP/venv-rel"
            "$RUNNER_TEMP/venv-rel/bin/python" -m pip install -q mypy "$RUNNER_TEMP"/wheels-rel/*.whl
            cargo build --locked --profile ci -p hft-journal --example testwriter --features hft-journal/writer -p hft-py --example pyfixture
            sudo prlimit --pid $$ --memlock=unlimited:unlimited
            HFT_PY_TOOLS=target/ci/examples HFT_PY_RELEASE_PYTHON="$RUNNER_TEMP/venv-rel/bin/python" python -m pytest -q crates/hft-py/tests/python
          fi
          for p in "${pkgs[@]}"; do python -m pip install -e "$p"; done
          python -m ruff check python strategies tools/az-probe
          if ((${#pkgs[@]})); then
            python -m mypy --strict "${pkgs[@]}"
            python -m pytest -q "${pkgs[@]}"
          fi

      # deploy/ lands in M3 (deploy/TESTS.md); every guard below is "the files exist".
      # The container tests (deploy/tests/container/, deploy/dev2/tests/container/) run only when
      # deploy/ or apps/hft-core/ (its thread plan) changed; nightly.yml runs them all every night.
      - name: Deploy checks (shellcheck, bats, unit verify, dev2 guard container tests)
        if: needs.paths.outputs.ops == 'true' || needs.paths.outputs.gen_host == 'true'
        env:
          DEPLOY_CONTAINER: ${{ needs.paths.outputs.gen_host }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends shellcheck bats
          mapfile -t sh < <(git ls-files 'deploy/*.sh')
          if ((${#sh[@]})); then shellcheck -S warning "${sh[@]}"; else echo "no deploy shell scripts yet"; fi
          mapfile -t bt < <(git ls-files 'deploy/*.bats')
          if ((${#bt[@]})); then bats "${bt[@]}"; fi
          mapfile -t units < <(git ls-files 'deploy/*.service' 'deploy/*.timer' 'deploy/*.slice' 'deploy/*.socket' 'deploy/*.path')
          if ((${#units[@]})); then
            # Test users and directory fixtures for systemd-analyze come from deploy (its CI fixture script).
            if [[ -f deploy/tests/ci-unit-fixtures.sh ]]; then sudo bash deploy/tests/ci-unit-fixtures.sh; fi
            systemd-analyze verify "${units[@]}"
          fi
          skip=()
          if [[ "$DEPLOY_CONTAINER" != true ]]; then
            skip=(--ignore=deploy/tests/container --ignore=deploy/dev2/tests/container)
            echo "deploy container tests skipped (no deploy/ or apps/hft-core/ code or config change; nightly runs them)"
          fi
          if [[ -d deploy/tests ]]; then
            python -m pip install pytest
            python -m pytest -q "${skip[@]}" deploy/tests
          fi
          if [[ -d deploy/dev2/tests ]]; then
            python -m pip install pytest
            python -m pytest -q "${skip[@]}" deploy/dev2/tests
          fi

  acceptance:
    needs: [paths, docs, decoupling-gate, ops-py, fast-test, fast-clippy, fast-dst, rust, arch-check, benchmarks,
            replay-dst, heavy-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Require all applicable checks of this lane on this commit
        env:
          HEAD: ${{ env.HEAD_SHA }}
          EVENT: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci-summary.py
      - name: Upload complete acceptance verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance
          path: target/xtask/acceptance.json
          if-no-files-found: error
          retention-days: 7
