# Temporary diagnosis of the Draining recovery HashTrail transition. No golden writes.
name: DST Drain recovery audit

on:
  push:
    branches: [codex/m2-integration]
    paths:
      - .github/workflows/dst-drain-audit.yml
      - .github/diagnostics/dst-drain-audit.rs

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            revision: 7a39cc3125581ab8e27d36d384a1eb111c516126
          - label: fixed
            revision: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit-tool
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          path: subject
          persist-credentials: false
      - name: Install pinned Rust toolchain
        working-directory: subject
        run: bash .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subject -> target
          key: dst-drain-${{ matrix.label }}
      - name: Record three unchanged conformance scenarios
        working-directory: subject
        env:
          AUDIT_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p crates/hft-testkit/examples "$GITHUB_WORKSPACE/evidence"
          cp ../audit-tool/.github/diagnostics/dst-drain-audit.rs crates/hft-testkit/examples/dst-drain-audit.rs
          git rev-parse HEAD > "$GITHUB_WORKSPACE/evidence/SOURCE_COMMIT"
          # Match the workspace feature unification used by the quality job and its lockfile.
          cargo build --locked --profile ci --workspace --all-features --examples
          ./target/ci/examples/dst-drain-audit "$GITHUB_WORKSPACE/evidence"
          (cd "$GITHUB_WORKSPACE/evidence" && sha256sum seed-* SOURCE_COMMIT > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dst-drain-${{ matrix.label }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
