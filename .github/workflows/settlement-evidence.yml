# Temporary evidence for the append-only cash fields; ordinary CI remains unchanged.
name: Settlement field evidence

on:
  push:
    branches: [codex/m2-integration]
    paths:
      - crates/hft-event/**
      - crates/hft-sim/**
      - .github/workflows/settlement-evidence.yml

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: bash .github/scripts/install-rust.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: settlement-evidence
      - name: Compare old bytes with only appended cash fields excluded
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          base = '94e687bc26b94b8f45a38ca410e9e137d10437b4'
          p = pathlib.Path('crates/hft-sim/src/hash.rs')
          text = subprocess.check_output(['git', 'show', f'{base}:{p.as_posix()}']).decode()
          for variant, length in [('OrderEvent', 96), ('ExternalFill', 80)]:
              start = text.index(f'RepMsg::{variant}(x) =>')
              end = text.index('\n        }', start)
              part = text[start:end]
              assert part.count('h.update(x.as_bytes());') == 1
              text = text[:start] + part.replace('h.update(x.as_bytes());', f'h.update(&x.as_bytes()[..{length}]);') + text[end:]
          p.write_text(text)
          p = pathlib.Path('crates/hft-sim/tests/common/scen.rs')
          text = p.read_text()
          for variant, tag, length in [('OrderEvent', 1, 96), ('ExternalFill', 7, 80)]:
              old = f'RepMsg::{variant}(x) => ({tag}, x.as_bytes()),'
              assert text.count(old) == 1
              text = text.replace(old, f'RepMsg::{variant}(x) => ({tag}, &x.as_bytes()[..{length}]),')
          p.write_text(text)
          PY
          cargo test --profile ci -p hft-sim --test golden
      - name: Restore full cash fields and generate candidate fixtures
        run: |
          git restore --source=HEAD -- crates/hft-sim/src/hash.rs crates/hft-sim/tests/common/scen.rs
          SIM_GOLDEN_BLESS=1 cargo test --profile ci -p hft-sim --test golden sim_123_cross_arch_golden
          cargo test --profile ci -p hft-sim --test golden
          cargo test --profile ci -p hft-sim --test sim settlement::
          cargo xtask gen-schema
          mkdir -p target/settlement-evidence
          git diff --binary > target/settlement-evidence/regen.patch
          git rev-parse HEAD > target/settlement-evidence/head.txt
          sha256sum target/settlement-evidence/regen.patch > target/settlement-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: settlement-field-evidence
          path: target/settlement-evidence/
          retention-days: 14
