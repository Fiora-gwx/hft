name: Strict cash fixture audit
on:
  push:
    branches: [codex/m2-cash-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free runner disk
        run: bash .github/scripts/free-disk.sh
      - name: Install pinned Rust toolchain
        run: bash .github/scripts/install-rust.sh
      - name: Prepare the standard workspace metadata
        run: |
          mkdir -p audit
          cp Cargo.lock audit/before.lock
          cargo xtask --help >audit/xtask.txt
          cp Cargo.lock audit/resolved.lock
          git diff -- Cargo.lock >audit/lock.patch
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-ci-v2
          save-if: false
      - name: Unknown-report defect and healthy control
        run: cargo test --locked --profile ci -p hft-testkit --features seq tk_053 -- --nocapture
      - name: Prepare replay test prerequisites
        if: ${{ !cancelled() }}
        run: bash .github/scripts/test-prereqs.sh
      - name: Build real replay test binaries
        if: ${{ !cancelled() }}
        run: cargo build --locked --profile ci -p replayer --tests --examples
      - name: Full replay CLI fixture suite
        if: ${{ !cancelled() }}
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          export HFT_REPLAY_EVIDENCE_DIR="$GITHUB_WORKSPACE/audit/replay"
          mkdir -p "$HFT_REPLAY_EVIDENCE_DIR"
          cargo test --locked --profile ci -p replayer --test cli -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-fixture-audit
          path: audit/
          retention-days: 7
