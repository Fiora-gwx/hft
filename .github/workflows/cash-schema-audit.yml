name: Cold ledger snapshot audit
on:
  push:
    branches: [codex/m2-cash-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free runner disk
        run: bash .github/scripts/free-disk.sh
      - name: Install pinned Rust toolchain
        run: bash .github/scripts/install-rust.sh
      - name: Prepare the standard workspace metadata
        run: |
          mkdir -p audit
          cp Cargo.lock audit/before.lock
          cargo xtask --help >audit/xtask.txt
          cp Cargo.lock audit/resolved.lock
          git diff -- Cargo.lock >audit/lock.patch
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-ci-v2
          save-if: false
      - name: Compare cold money at every real engine snapshot
        run: |
          mkdir -p audit crates/hft-testkit/examples
          git rev-parse HEAD >audit/head.txt
          cp .github/scripts/cold-ledger-audit.rs crates/hft-testkit/examples/cold_ledger_audit.rs
          cargo run --locked --profile ci -p hft-testkit --features seq --example cold_ledger_audit >audit/cold.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-ledger-audit
          path: audit/
          retention-days: 7
