[package]
name = "hft-sim"
description = "Simulated exchange for Sim accounts: deterministic taker/maker matching on live market data, balances, positions, cross margin, funding and liquidation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Plain test files build as one binary (tests/main.rs); files with process-wide
# effects are separate [[test]] targets.
autotests = false

[lints]
workspace = true

# M2 part (README "已知限制与后续工作"): the pure core. The `task` feature (SimGwTask, hft-rt +
# hft-journal), the stress transforms and `queue-hftbacktest` arrive with M4.
[dependencies]
hft-types.workspace = true
hft-refdata.workspace = true
hft-event.workspace = true
hft-book.workspace = true
xxhash-rust.workspace = true
zerocopy.workspace = true
# Deterministic per-account latency sub-streams (README "9. 确定性").
rand_chacha = { version = "0.9", default-features = false }
# `calib` feature: the calibration-table JSON (README "校准表").
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
calib = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
hft-testkit.workspace = true
proptest.workspace = true
criterion.workspace = true
static_assertions.workspace = true
serde_json = "1"
toml.workspace = true

[[bench]]
name = "sim"
harness = false

[[test]]
name = "account"
path = "tests/account.rs"

[[test]]
name = "golden"
path = "tests/golden.rs"

[[test]]
name = "sim"
path = "tests/main.rs"
