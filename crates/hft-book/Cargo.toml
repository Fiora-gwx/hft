[package]
name = "hft-book"
description = "Dense-array L2 order books, BBO cache, snapshot application and BookSet snapshot/restore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Plain test files build as one binary (tests/main.rs); files with process-wide
# effects are separate [[test]] targets.
autotests = false

[lints]
workspace = true

[dependencies]
hft-types.workspace = true
hft-refdata.workspace = true
hft-event.workspace = true
hft-strategy-sdk.workspace = true
xxhash-rust.workspace = true
# Safe, alignment-checked view of caller memory as `[u64]` and the snapshot row codecs.
zerocopy.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "book"
harness = false

[[test]]
name = "alloc"
path = "tests/alloc.rs"

[[test]]
name = "book"
path = "tests/main.rs"
