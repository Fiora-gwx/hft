# Reference-machine budgets of hft-book's benchmarks (source constants read by `cargo xtask bench-gate`).
# One table per registered benchmark name (benchmarks/README.md "基准名登记"); values in ns, equal to the
# README "延迟与资源契约" table (`cargo xtask doc-check` compares them). Format: tools/README.md "cargo xtask doc-check".
# `bound`/`levels`: the benchmarks 单 crate 基准上限表 row this budget may not exceed (per-level bound: value / levels).

[book_delta_inwin]
p50_ns = 15
p99_ns = 40
bound = "簿更新"
levels = 1

[book_batch_20]
p50_ns = 250
p99_ns = 600
bound = "簿更新"
levels = 20

[book_delta_best_remove]
p99_ns = 100

[book_delta_ovf]
p99_ns = 150

[book_top_apply]
p50_ns = 8

[book_best]
budget_ns = 3

[book_iter_20]
budget_ns = 100

[book_snapshot_1000]
p99_ns = 30000

[book_snapshot_topn20]
