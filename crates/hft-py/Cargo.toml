[package]
name = "hft-py"
description = "PyO3 bindings: read-only journal to Arrow, ledger/PnL through hft-ledger's journal cold consumer, SDK params blob encoding and decoding, read-only heartbeat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Rust tests: one binary (tests/main.rs) plus the memory test, which samples process memory alone.
autotests = false

[lints]
workspace = true

[lib]
name = "hft_py"
# cdylib: the extension module built by maturin; rlib: the Rust tests and benches.
crate-type = ["cdylib", "rlib"]

[features]
# Test hooks exported as `hft_py._testing` (README "打包与发布"); never in a release wheel.
testing = []

[dependencies]
hft-types.workspace = true
hft-refdata.workspace = true
hft-event.workspace = true
# Reader only (no `writer` feature; crates/AGENTS.md rule 8).
hft-journal.workspace = true
hft-strategy-sdk = { workspace = true, features = ["schema-json"] }
hft-ledger.workspace = true
hft-rt.workspace = true
zerocopy.workspace = true
# abi3 (one wheel for Python >= 3.10); libpython is not linked when maturin builds the extension
# (it sets PYO3_BUILD_EXTENSION_MODULE).
pyo3 = { version = "0.29", default-features = false, features = ["macros", "abi3-py310"] }
# No arrow-rs: columns are filled in Rust and handed to pyarrow (src/cols.rs); the arrow-rs
# closure carries num-bigint (deny.toml ban) and tiny-keccak (CC0-1.0).
# index.json and the schema descriptors (notes/report) that the SDK's OwnedSchema does not keep.
serde_json = "1"

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
# Fixture generator (examples/pyfixture.rs): config blob digests. Not `workspace = true` (asm).
sha2 = "0.10"

[[test]]
name = "hft_py_tests"
path = "tests/main.rs"

[[test]]
name = "memory"
path = "tests/memory.rs"

[[bench]]
name = "py_events"
harness = false
