[package]
name = "hft-oms"
description = "Order slots, client order ids, the order state machine with Unknown convergence, LegLink second legs, LegTracker and the in-flight book"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Plain test files build as one binary (tests/main.rs); files with process-wide
# effects are separate [[test]] targets.
autotests = false

[lints]
workspace = true

[features]
# Planted defects for the DST self-test (src/planted.rs): only hft-testkit's `planted` feature
# enables this; never in a production build (crates/hft-testkit TESTS.md TK-178).
planted = []
# State hooks for this crate's own tests (put a slot into a given state, read private fields);
# only enabled from [dev-dependencies] (cargo xtask deps rule 12).
testing = []
# Read-only, bounded diagnostics for the DST verification binary; absent in production.
testkit = []

[dependencies]
hft-types.workspace = true
hft-refdata.workspace = true
hft-event.workspace = true
hft-strategy-sdk.workspace = true
zerocopy.workspace = true

[dev-dependencies]
hft-oms = { path = ".", features = ["testing"] }
hft-testkit.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "oms"
harness = false

[[test]]
name = "alloc"
path = "tests/alloc.rs"

[[test]]
name = "latency"
path = "tests/latency.rs"

[[test]]
name = "legs"
path = "tests/legs.rs"

[[test]]
name = "recover"
path = "tests/recover.rs"

[[test]]
name = "oms"
path = "tests/main.rs"
