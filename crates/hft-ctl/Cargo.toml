[package]
name = "hft-ctl"
description = "ctl-gateway (Unix socket, authentication, permissions, command checks, ctl ring, CmdResult return) and the Rust client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One test binary (tests/main.rs includes every group module).
autotests = false

[lints]
workspace = true

[dependencies]
hft-ctl-proto.workspace = true
hft-types.workspace = true
hft-event.workspace = true
hft-refdata.workspace = true
hft-strategy-sdk = { workspace = true, features = ["schema-json"] }
hft-risk.workspace = true
# `ParsedConfig<S>` (the Mailbox object) is hft-sequencer's type.
hft-sequencer.workspace = true
hft-rt.workspace = true
hft-journal.workspace = true
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
base64 = "0.22"
toml.workspace = true
zerocopy.workspace = true
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
# End-to-end tests (TESTS.md baseline E2E): the real sequencer with its test hooks, the test strategy
# set `TestStrategies`, and the component configurations an `EngineSetup` needs.
hft-sequencer = { workspace = true, features = ["testing"] }
hft-testkit.workspace = true
hft-oms.workspace = true
hft-exec.workspace = true
hft-ledger.workspace = true

[[bench]]
name = "ingest"
harness = false

[[test]]
name = "ctl"
path = "tests/main.rs"
