[package]
name = "hft-types"
description = "Fixed-point numbers, IDs, wire codes and pure helpers shared by every hft crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Plain test files build as one binary (tests/main.rs); files with process-wide
# effects are separate [[test]] targets.
autotests = false

[lints]
workspace = true

[dependencies]
zerocopy.workspace = true

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
criterion.workspace = true
trybuild.workspace = true

[[bench]]
name = "types"
harness = false

[[test]]
name = "alloc"
path = "tests/alloc.rs"

[[test]]
name = "types"
path = "tests/main.rs"
