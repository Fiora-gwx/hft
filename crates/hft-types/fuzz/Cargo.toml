[package]
name = "hft-types-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hft-types = { path = ".." }

# Not a member of the root workspace: built only by `cargo fuzz` (pinned nightly, tools/README.md).
[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
