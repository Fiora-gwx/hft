[package]
name = "hft-sequencer"
description = "hft-core's single-writer main loop: prioritized input intake, seq journal, dispatch to book/strategies/exec/risk/OMS/ledger, the four drivers and the advisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One test binary (tests/main.rs includes every group module).
autotests = false

[lints]
workspace = true

[features]
# hft-journal's writer (`JournalWriter` as `JournalSink`): only apps/hft-core and apps/replayer enable it.
live = ["hft-journal/writer"]
# Test hooks (call trace, state access); only enabled from [dev-dependencies] (cargo xtask deps rule 12).
testing = []

[dependencies]
hft-types.workspace = true
hft-refdata.workspace = true
hft-event.workspace = true
hft-book.workspace = true
hft-oms.workspace = true
hft-risk.workspace = true
hft-ledger.workspace = true
hft-exec.workspace = true
hft-strategy-sdk.workspace = true
hft-journal.workspace = true
hft-rt.workspace = true
zerocopy.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
hft-sequencer = { path = ".", features = ["testing"] }
hft-strategy-sdk = { workspace = true, features = ["testing", "schema-json"] }
hft-testkit.workspace = true
# Not `workspace = true`: the workspace entry enables `asm` (needs a C toolchain per target).
sha2 = "0.10"
proptest.workspace = true
criterion.workspace = true

[[test]]
name = "seq"
path = "tests/main.rs"

# SDK-140: the counting global allocator is process-wide, so it gets its own binary.
[[test]]
name = "sdk_alloc"
path = "tests/sdk_alloc.rs"

[[bench]]
name = "seq"
harness = false
