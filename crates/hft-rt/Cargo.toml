[package]
name = "hft-rt"
description = "Runtime primitives shared by hot and cold processes: SPSC rings, TSC clock, pinning, host checks, huge pages, heartbeats, idle policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Plain test files build as one binary (tests/main.rs); files with process-wide
# effects are separate [[test]] targets.
autotests = false

[lints]
workspace = true

[dependencies]
hft-types.workspace = true
libc.workspace = true
zerocopy.workspace = true

[target.'cfg(loom)'.dependencies]
loom.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
trybuild.workspace = true
rtrb.workspace = true
static_assertions.workspace = true

[[bench]]
name = "rt"
harness = false

[[test]]
name = "alloc"
path = "tests/alloc.rs"

[[test]]
name = "calib"
path = "tests/calib.rs"

[[test]]
name = "loom_kill"
path = "tests/loom_kill.rs"

[[test]]
name = "loom_mailbox"
path = "tests/loom_mailbox.rs"

[[test]]
name = "loom_seqcell"
path = "tests/loom_seqcell.rs"

