[package]
name = "hft-strategy-sdk"
description = "The stable strategy interface: parameter schema and codec, descriptors, snapshot read/write types (M1 part)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Canonical schema JSON, `schema_digest` and `OwnedSchema` (cold tools, ctl-gateway, hft-py).
schema-json = ["dep:sha2"]

[dependencies]
hft-types.workspace = true
hft-event.workspace = true
zerocopy.workspace = true

# Not `workspace = true`: the workspace entry enables `asm`, whose sha2-asm build needs a C
# toolchain for the target (same reasoning as hft-refdata); the digest is identical either way.
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
# Enables `schema-json` for this crate's own tests and benches.
hft-strategy-sdk = { path = ".", features = ["schema-json"] }
proptest.workspace = true
criterion.workspace = true
toml.workspace = true

[[bench]]
name = "params"
harness = false
