[package]
name = "venue-polymarket"
description = "Polymarket CLOB protocol for binary outcome tokens: market channel books, level changes and trades with synthetic sequence ids, token binding table, PING heartbeat, capability defaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
hft-types.workspace = true
hft-refdata.workspace = true
hft-event.workspace = true
hft-venue-proto.workspace = true
# Per-message structs over borrowed strings, as in the other venue crates; no generic JSON values.
sonic-rs = "0.5"
serde = { version = "1", default-features = false, features = ["derive"] }
# Order and API signatures (README "签名"): EIP-712 digests over keccak-256, secp256k1 ECDSA,
# L2 Base64(HMAC-SHA256). Not the workspace sha2 entry (its `asm` feature needs a C toolchain).
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
hft-venue-proto = { workspace = true, features = ["testkit"] }
# Golden comparison only (never in [dependencies]).
serde_json = "1"

[[test]]
name = "polymarket"
path = "tests/main.rs"
