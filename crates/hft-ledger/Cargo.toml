[package]
name = "hft-ledger"
description = "Event-sourced equity and PnL ledger per (account, venue) and (account, group), and its journal cold consumer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Plain test files build as one binary (tests/main.rs); files with process-wide
# effects are separate [[test]] targets.
autotests = false

[lints]
workspace = true

[features]
# Planted defects for the DST self-test (src/planted.rs): only hft-testkit's `planted` feature
# enables this; never in a production build (crates/hft-testkit TESTS.md TK-178).
planted = []
default = []
# Read-only cold-consumer diagnostics, excluded from production builds.
testkit = []

[dependencies]
hft-types.workspace = true
hft-refdata.workspace = true
hft-event.workspace = true
hft-strategy-sdk.workspace = true
zerocopy.workspace = true

[dev-dependencies]
hft-testkit.workspace = true
proptest.workspace = true
rstest.workspace = true
criterion.workspace = true
trybuild.workspace = true

[[bench]]
name = "ledger"
harness = false

[[test]]
name = "config"
path = "tests/config.rs"

[[test]]
name = "ledger"
path = "tests/main.rs"
