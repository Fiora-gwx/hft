[package]
name = "hft-testkit"
description = "Shared test infrastructure: proptest generators, manual clocks, seed derivation, per-thread allocation counting, the DST framework and state-hash tools (dev-dependencies, xtask and the verification bundle only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Integration tests are declared below: one binary for the allocation-counting tests (each installs
# its own global allocator) and one for everything else, to keep link time low.
autotests = false

[lints]
workspace = true

# The engine crates (hft-sim, hft-sequencer, hft-oms, hft-risk, hft-ledger, hft-exec) are the DST
# engine adapter's (`SeqSut`, feature `seq`; README "6. DST 框架").
[dependencies]
hft-types.workspace = true
hft-event.workspace = true
hft-rt.workspace = true
hft-refdata.workspace = true
# Test strategies (src/strategies) and the SDK stubs; `schema-json` for the exported schemas.
hft-strategy-sdk = { workspace = true, features = ["schema-json"] }
hft-strat-lib.workspace = true
zerocopy.workspace = true
proptest.workspace = true
xxhash-rust.workspace = true
# HistBench histogram (README "9. 分配计数与基准驱动"); 7.x without serialization/sync features.
hdrhistogram = { version = "7.5", default-features = false }
# DST randomness: one ChaCha8 stream per actor, derived from the run seed (README "DST 的世界模型" 5).
rand_chacha = { version = "0.9", default-features = false }
rand_core = { version = "0.9", default-features = false }
# The engine adapter `SeqSut` (feature `seq`).
hft-sequencer = { workspace = true, optional = true, features = ["testkit", "replay-io"] }
hft-journal = { workspace = true, optional = true }
hft-sim = { workspace = true, optional = true }
hft-oms = { workspace = true, optional = true, features = ["testkit"] }
hft-risk = { workspace = true, optional = true }
hft-ledger = { workspace = true, optional = true, features = ["testkit"] }
hft-exec = { workspace = true, optional = true }
# SHA-256 of the configuration blobs (not `workspace = true`: that entry enables `asm`).
sha2 = { version = "0.10", optional = true }

[features]
# `MockViews`, `StrategyHarness`, `ModelHarness` (README "4. 策略测试桩"); enables the SDK's
# `testing` stubs, so only dev-dependencies turn it on.
sdk-mock = ["hft-strategy-sdk/testing"]
# The engine adapter `SeqSut<S>` over the real sequencer and `hft_sim::SimExchange`.
seq = ["dep:hft-sequencer", "dep:hft-journal", "dep:hft-sim", "dep:hft-oms", "dep:hft-risk", "dep:hft-ledger", "dep:hft-exec", "dep:sha2"]
# The `hft-dst` runner binary (verification bundle only; README "8. hft-dst 运行器"); it runs the
# real engine.
dst-bin = ["seq"]

[[bin]]
name = "hft-dst"
path = "src/bin/hft-dst.rs"
required-features = ["dst-bin"]

[[test]]
name = "alloc"
path = "tests/alloc.rs"

[[test]]
name = "bench"
path = "tests/bench.rs"

[[test]]
name = "testkit"
path = "tests/main.rs"

# The cargo-test entry of the DST suites (README "6. DST 框架": repository-root tests/dst/, one
# #[test] per suite).
[[test]]
name = "dst"
path = "../../tests/dst/main.rs"
required-features = ["seq"]

[dev-dependencies]
hft-testkit = { path = ".", features = ["sdk-mock"] }
criterion.workspace = true

[[bench]]
name = "dst"
harness = false
