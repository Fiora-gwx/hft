[package]
name = "venue-coinbase-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
[package.metadata]
cargo-fuzz = true
[workspace]
members = ["."]
[dependencies]
libfuzzer-sys = "0.4"
venue-coinbase = { path = ".." }
hft-types = { path = "../../hft-types" }
hft-refdata = { path = "../../hft-refdata" }
hft-event = { path = "../../hft-event" }
hft-venue-proto = { path = "../../hft-venue-proto", features = ["testkit"] }
serde_json = "1"

[[bin]]
name = "coinbase-spot"
path = "fuzz_targets/coinbase_spot.rs"
test = false
doc = false
bench = false
