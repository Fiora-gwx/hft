[package]
name = "hft-ctl-proto"
description = "Control-plane protocol: frames, request/response JSON schema, JSON → ControlCmd normalization, cmd_hash and the permission table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hft-types.workspace = true
hft-refdata.workspace = true
hft-event.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
zerocopy.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
zerocopy.workspace = true
toml.workspace = true

[[bench]]
name = "normalize"
harness = false
