[package]
name = "hft-risk"
description = "Hot-path risk: intent classification, the check chain, versioned RiskParams, token buckets, daily loss, margin tiers, leverage cap, reconciliation grading and the mode module (desired modes, caps, gates, kill projection)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Plain test files build as one binary (tests/main.rs); files with process-wide
# effects are separate [[test]] targets.
autotests = false

[lints]
workspace = true

[dependencies]
hft-types.workspace = true
hft-refdata.workspace = true
hft-event.workspace = true
hft-strategy-sdk.workspace = true
# Snapshot row codecs.
zerocopy.workspace = true

[dev-dependencies]
hft-testkit.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "risk"
harness = false

[[test]]
name = "alloc"
path = "tests/alloc.rs"

[[test]]
name = "mode"
path = "tests/mode.rs"

[[test]]
name = "params"
path = "tests/params.rs"

[[test]]
name = "risk"
path = "tests/main.rs"
