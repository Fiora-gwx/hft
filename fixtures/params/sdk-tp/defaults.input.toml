# SDK-120 / SDK-121 parameter golden (all defaults). Shape: tools/README.md "hft-cfg" strategy TOML.
[strategy]
instance = "sdk-probe"
account = "sdk-a1"
schema = { id = 65281, version = 2 }
version = 1
source = "manual"

[defaults]
open_th = "0.5%"
cooldown_ms = "20s"
pct_bin = "0.01%"
enabled = "true"
mode = "a"

[[groups]]
n = 1
asset = "BTC"
open_allowed = true
legs = [ { inst = "v1:BTC-SPOT" }, { inst = "v2:BTC-PERP" } ]

[[groups]]
n = 2
asset = "BTC"
open_allowed = true
legs = [ { inst = "v1:BTC-SPOT" }, { inst = "v2:BTC-PERP" } ]

[[groups]]
n = 3
asset = "BTC"
open_allowed = true
legs = [ { inst = "v1:BTC-SPOT" }, { inst = "v2:BTC-PERP" } ]
